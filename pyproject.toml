[project]
name = "configlock"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Philipp.Stahlberg", email = "131917964+PhilippStahlbergGit@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "typer>=0.25.1",
]

[project.scripts]
configlock = "configlock.main:main"
docs-serve = "configlock.docs_server:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "radon>=6.0.1",
    "reloadserver>=1.0.0",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
