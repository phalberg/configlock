[project]
name = "cfglock"
version = "0.1.3"
description = "The official Python engine for the ConfigLock ecosystem"
readme = "README.md"
authors = [
    { name = "Philipp.Stahlberg", email = "131917964+PhilippStahlbergGit@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "typer>=0.25.1",
] 

[project.scripts]
configlock = "cfglock.cli:app"
cfglock = "cfglock.cli:app"
cfl = "cfglock.cli:app"
docs-serve = "cfglock.docs_server:main"

[project.urls]
Homepage = "https://github.com/phalberg/configlock"
Repository = "https://github.com/phalberg/configlock"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "reloadserver>=1.0.0",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
