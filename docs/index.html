<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ConfigLock Web Portal</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; line-height: 1.6; }
        input, button { display: block; width: 100%; margin-bottom: 10px; padding: 10px; box-sizing: border-box; }
        #output { background: #f4f4f4; padding: 10px; white-space: pre-wrap; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h2>ConfigLock Web Portal</h2>
    <input type="text" id="repo" placeholder="owner/repo (e.g. phalberg/configlock)">
    <input type="text" id="path" placeholder="path/to/config.yaml">
    <input type="password" id="token" placeholder="GitHub Personal Access Token">
    <button onclick="fetchFile()">Fetch Config</button>

    <h3>Result:</h3>
    <div id="output">No data yet...</div>

    <script>
        async function fetchFile() {
            const repo = document.getElementById('repo').value;
            const path = document.getElementById('path').value;
            const token = document.getElementById('token').value;
            const output = document.getElementById('output');

            output.innerText = "Fetching...";

            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                    headers: { 'Authorization': `token ${token}` }
                });

                if (!response.ok) throw new Error(`GitHub error: ${response.status}`);

                const data = await response.json();
                // Decode Base64 (using atob) and display
                const content = atob(data.content.replace(/\n/g, ''));
                output.innerText = content;
            } catch (err) {
                output.innerText = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>
